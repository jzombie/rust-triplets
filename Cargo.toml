
[package]
name = "triplets"
description = "A composable, deterministic text data pipeline for ML. Ingest, denoise, chunk, split, and sample multi-source corpora into reproducible training triplets."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories = ["algorithms", "artificial-intelligence", "science", "text-processing"]
keywords = [
    "train-test-split",
    "triplet-mining",
    "dataset-sampling",
    "preprocessing",
    "bm25",
]

[package.metadata.cargo-udeps.ignore]
development = ["indoc"]
[workspace]
members = [
    ".",
    "crates/triplets-core",
    "crates/triplets-debug",
    "crates/triplets-hf-source",
    "crates/triplets-offline-embedder",
    "crates/triplets-srd-source",
]
resolver = "2"

[workspace.package]
version = "0.25.0-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
repository = "https://github.com/jzombie/rust-triplets"

[workspace.dependencies]
bitcode = "0.6.9"
bm25 = { version = "2.3.2", features = ["parallelism"] }
cache-manager = "0.4.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
indexmap = "2.14.0"
indoc = "2.0.7"
line-ending = "1.5.1"
parquet = { version = "59.1.0", features = ["json"] }
rand = { version = "0.9.3", features = ["std", "small_rng"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "query"] }
reqwest-drive = "0.13.3-alpha"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serial_test = "3.5.0"
simd-r-drive = "0.16.2-alpha"
siphasher = "1.0.3"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
triplets = { path = ".", version = "0.25.0-alpha" }
triplets-core = { path = "crates/triplets-core", version = "0.25.0-alpha" }
triplets-debug = { path = "crates/triplets-debug", version = "0.25.0-alpha" }
triplets-hf-source = { path = "crates/triplets-hf-source", version = "0.25.0-alpha" }
triplets-offline-embedder = { path = "crates/triplets-offline-embedder", version = "0.25.0-alpha" }
triplets-srd-source = { path = "crates/triplets-srd-source", version = "0.25.0-alpha" }
walkdir = "2.5.0"

[workspace.metadata.cargo-udeps.ignore]
development = ["triplets-srd-source"]

[features]
default = []
huggingface = ["dep:triplets-hf-source", "reqwest-drive"]
bm25-mining = ["dep:bm25", "triplets-core/bm25-mining"]
extended-metrics = ["triplets-core/extended-metrics"]

[dependencies]
bitcode = { workspace = true }
bm25 = { workspace = true, optional = true }
cache-manager = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
indexmap = { workspace = true }
line-ending = { workspace = true }
parquet = { workspace = true, optional = true }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, optional = true }
reqwest-drive = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
simd-r-drive = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
triplets-core = { workspace = true }
triplets-debug = { workspace = true }
triplets-hf-source = { workspace = true, optional = true }
walkdir = { workspace = true }

[dev-dependencies]
indoc = { workspace = true }
serde_json = { workspace = true }
siphasher = { workspace = true }
